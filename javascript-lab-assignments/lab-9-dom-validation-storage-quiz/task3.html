<!doctype html><html><head><meta charset='utf-8'><title>Quick Notes</title></head><body><h1>Quick Notes</h1><input id='note' aria-label='Your note'><button id='save'>Save note</button><p id='saved'></p><script>const n=document.getElementById('note'),p=document.getElementById('saved');n.value=localStorage.getItem('lab-note')||'';p.textContent=n.value?'Saved note: '+n.value:'No saved note yet';document.getElementById('save').addEventListener('click',()=>{localStorage.setItem('lab-note',n.value);p.textContent='Saved note: '+n.value;});</script></body></html>
