<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Quick Notes</title></head><body><h1>Quick Notes</h1><label for='note'>Your note</label><input id='note' type='text'><button type='button' id='save'>Save note</button><p id='saved' aria-live='polite'></p><script>const n=document.getElementById('note'),p=document.getElementById('saved');n.value=localStorage.getItem('lab-note')||'';p.textContent=n.value?'Saved note: '+n.value:'No saved note yet';document.getElementById('save').addEventListener('click',()=>{localStorage.setItem('lab-note',n.value);p.textContent='Saved note: '+n.value;});</script></body></html>
