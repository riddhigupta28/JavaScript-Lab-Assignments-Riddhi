<!doctype html><html><head><meta charset='utf-8'><title>Mini Quiz</title></head><body><h1>Mini Quiz</h1><p>What is 2 + 3?</p><button data-answer='4'>4</button><button data-answer='5'>5</button><button data-answer='6'>6</button><p id='result'></p><script>document.querySelectorAll('button[data-answer]').forEach(b=>b.addEventListener('click',()=>document.getElementById('result').textContent=b.dataset.answer==='5'?'Correct!':'Try again'));</script></body></html>
