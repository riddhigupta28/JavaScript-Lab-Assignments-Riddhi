<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Mini Quiz</title></head><body><h1>Mini Quiz</h1><p>What is 2 + 3?</p><button type='button' data-answer='4'>4</button><button data-answer='5'>5</button><button data-answer='6'>6</button><p id='result' aria-live='polite'></p><script>document.querySelectorAll('button[data-answer]').forEach(b=>b.addEventListener('click',()=>document.getElementById('result').textContent=b.dataset.answer==='5'?'Correct!':'Try again'));</script></body></html>
